name: Version Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determine bump level from merged PR labels
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUMP="patch"
          PR_NUMBER=$(gh pr list --state merged --search "${GITHUB_SHA}" --json number --jq '.[0].number' || true)

          # Limitation: squash merges or rebases may not reliably map commit SHA to a PR.
          if [ -n "${PR_NUMBER}" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
            if echo "$LABELS" | grep -qx "release:major"; then
              BUMP="major"
            elif echo "$LABELS" | grep -qx "release:minor"; then
              BUMP="minor"
            elif echo "$LABELS" | grep -qx "release:patch"; then
              BUMP="patch"
            fi
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
      - name: Calculate next semantic tag
        id: next
        run: |
          set -euo pipefail
          LATEST=$(git tag --list 'version-*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="version-0.1.0"
          fi

          VERSION="${LATEST#version-}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="version-${MAJOR}.${MINOR}.${PATCH}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "Tag already exists, skipping."
            exit 0
          fi
          git tag "${{ steps.next.outputs.next }}"
          git push origin "${{ steps.next.outputs.next }}"
